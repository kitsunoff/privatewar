// Private War: recommended settings for a player-hosted listen server (design/08-lobby.md d.2).
//
// Use: copy this file to garrysmod/cfg/, then run "exec privatewar_recommended" in the console BEFORE the map is
// loaded (New Game menu, or on a dedicated server put the lines into server.cfg). maxplayers is read when the map
// loads; changing it later needs a new map load.
//
// In the New Game menu the same values are: Max Players 12, "Allow friends to join" (P2P) on.

// Bots need a listen server with more than one slot; Singleplayer cannot create them. 12 leaves room for bots
// (bots.fill) and one free slot for a friend who joins mid-match.
maxplayers 12

// Let friends join through Steam "Join Game" without a backend, but only friends.
p2p_enabled 1
p2p_friendsonly 1
